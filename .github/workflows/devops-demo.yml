name: Customer Portal - Production

on:
  workflow_dispatch:
    inputs:
      simulate_failure:
        description: 'Simulate failed tests?'
        required: true
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

jobs:
  Build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build application
        run: echo "Building Customer Portal..."

  Test:
    runs-on: ubuntu-latest
    needs: Build
    steps:
      - name: Run tests
        run: |
          echo "Running Customer Portal tests..."

          if [ "${{ inputs.simulate_failure }}" = "true" ]; then
            echo "Simulating test failures..."
            exit 1
          fi

          echo "All tests passed."

  Deploy:
    runs-on: ubuntu-latest
    needs: Test
    steps:
      - name: Deploy to production
        run: echo "Deploying Customer Portal to production..."
