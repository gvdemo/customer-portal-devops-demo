name: Customer Portal - Production

on:
  workflow_dispatch:
    inputs:
      simulate_failure:
        description: 'Simulate failed tests?'
        required: true
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

jobs:
  Build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build application
        run: echo "Building Employee Portal..."

  Test:
    runs-on: ubuntu-latest
    needs: Build
    steps:
      - name: Run tests
        run: |
          echo "Running Employee Portal tests..."

          if [ "${{ inputs.simulate_failure }}" = "true" ]; then
            echo "Simulating test failures..."
            exit 1
          fi

          echo "All tests passed."

  ServiceNowDevOpsChange:
    needs: Test
    runs-on: ubuntu-latest
    name: 'ServiceNow DevOps Change'
    steps:
      - name: ServiceNow Change
        uses: ServiceNow/servicenow-devops-change@v5.1.0
        with:
          devops-integration-token: ${{ secrets.SN_DEVOPS_TOKEN }}
          instance-url: ${{ secrets.SN_INSTANCE_URL }}
          tool-id: ${{ secrets.SN_ORCHESTRATION_TOOL_ID }}
          context-github: ${{ toJSON(github) }}
          job-name: 'ServiceNow DevOps Change'

  Deploy:
    runs-on: ubuntu-latest
    needs: ServiceNowDevOpsChange
    steps:
      - name: Deploy to production
        run: echo "Deploying Employee Portal to production..."
